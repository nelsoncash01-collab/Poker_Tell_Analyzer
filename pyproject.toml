[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-tell-analysis"
version = "0.0.1"
description = "Per-individual poker tell analysis from recorded video + hand history. No cross-player transfer."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "av>=12.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
poker-tell = "poker_tell.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
